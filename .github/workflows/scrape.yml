name: Scrape

on:
  workflow_dispatch:

concurrency:
  group: scrape-jobit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      # Corre sobre el deploy en /srv/jobit, no sobre el checkout: el output
      # y el cache de detalles viven ahí, fuera del rsync. El cron lo hace
      # como `jobit`; el runner no puede escribir ese jobs.json (EACCES).
      #
      # Desde acá solo se refresca Uruguay Concursa: BuscoJobs contesta 403 a
      # la IP del VPS. Lo suyo entra por POST /api/ingest/jobs, desde una
      # máquina que no esté bloqueada, con `bun run scrape:push`. Mientras
      # tanto keep.ts conserva lo de la última subida en vez de borrarlo.
      - name: Scrape into /srv/jobit
        working-directory: /srv/jobit
        run: sudo -u jobit env PATH=/opt/bun:$PATH /opt/bun/bun run scrape
