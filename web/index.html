<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ofertas de trabajo en Uruguay de todos los rubros, con filtro para puestos sin experiencia previa."
    />
    <title>JobIt · Ofertas de trabajo en Uruguay</title>
    <script>
      /* Paints the stored theme before first render so there is no flash. */
      try {
        const stored = JSON.parse(localStorage.getItem("jobit.prefs.v1") || "{}");
        const theme =
          stored.theme === "light" || stored.theme === "dark"
            ? stored.theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
