    <script>
      /* Paints the stored theme before first render so there is no flash. */
      try {
        const stored = JSON.parse(localStorage.getItem("jobit.prefs.v1") || "{}");
        const theme =
          stored.theme === "light" || stored.theme === "dark"
            ? stored.theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      <h1>JobIt · Ofertas de trabajo en Uruguay</h1>
      <p>
        JobIt junta en un solo lugar las ofertas de trabajo publicadas en portales uruguayos y los
        llamados del Estado en Uruguay Concursa. Se filtran por rubro, departamento, jornada y
        modalidad, y las que no piden experiencia previa quedan marcadas, para que encontrar el
        primer empleo no dependa de revisar cinco sitios distintos.
      </p>
      <p>
        La aplicación necesita JavaScript para funcionar. Mientras tanto, las fuentes que consulta
        están abiertas:

        <a href="https://www.uruguayconcursa.gub.uy/">Uruguay Concursa</a>.
