<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel · JobIt</title>
    <!-- Nada de acá va a un buscador. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Mismo criterio que la app: el tema se pinta antes del primer render. */
      try {
        const stored = JSON.parse(localStorage.getItem("jobit.prefs.v1") || "{}");
        const theme =
          stored.theme === "light" || stored.theme === "dark"
            ? stored.theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
