server {
    listen 80;
    listen [::]:80;
    server_name jobs.wefaber.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobs.wefaber.net;

    ssl_certificate     /etc/letsencrypt/live/jobs.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.wefaber.net/privkey.pem;

    root /var/www/jobs.wefaber.net;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Dos permisos de este CSP no son descuido y romperlos rompe una función:
    #
    #   frame-ancestors *  el ?embed= existe para que otras páginas metan una
    #                      oferta en un iframe. Poner 'self' acá, o agregar
    #                      X-Frame-Options, lo mata en silencio.
    #   connect-src https: las fuentes propias que agrega la persona son urls
    #                      https ajenas que el navegador pide directo.
    #
    # El 'unsafe-inline' de script es por el script que pinta el tema antes del
    # primer render; la app no tiene ningún sink de html crudo, así que el CSP
    # acá es defensa en profundidad y no la única línea.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors *" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El build lleva hash en el nombre, así que puede cachearse para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El panel es su propio bundle. Va antes del catch-all de abajo, que si no
    # se lo comería y devolvería la app.
    #
    # El admin solo se administra desde la VPN interna (Tailscale): el rango
    # 100.64.0.0/10 es el que usa Tailscale en IPv4 y fd7a:115c:a1e0::/48 en
    # IPv6. La clave sigue siendo la credencial; esto es la segunda cerradura,
    # para que ni siquiera se pueda intentar desde afuera.
    #
    # Ojo si algún día se pone Cloudflare en modo proxy delante: ahí el
    # $remote_addr pasa a ser de Cloudflare y hay que sumar set_real_ip_from
    # con sus rangos, o esto niega a todo el mundo.
    location = /admin {
        allow 127.0.0.1;
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;
        try_files /admin.html =404;
        add_header Cache-Control "no-cache";
    }

    # El panel de empresa es autoservicio y público: la empresa entra con su
    # cuenta, no con la clave del admin.
    location = /empresas {
        try_files /empresas.html =404;
        add_header Cache-Control "no-cache";
    }

    # Las dos legales son archivos sueltos del build. Sin esto, el catch-all de
    # abajo devolvería la app y la url quedaría mostrando el buscador.
    location = /terminos {
        try_files /terminos.html =404;
    }

    location = /privacidad {
        try_files /privacidad.html =404;
    }

    # El worker corre afuera del servidor y sube el resultado del scrapeo por
    # acá, así que este es el único POST grande de la API: cinco megas de JSON
    # que viajan comprimidos en menos de uno. Necesita su propio bloque porque
    # el de abajo corta en 16k, y va exacto (=) para que gane sin depender del
    # orden. La ruta contesta 404 mientras no haya token configurado.
    location = /api/ingest/jobs {
        client_max_body_size 4m;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cinco megas desde una conexión hogareña tardan más que una lectura.
        proxy_read_timeout 120s;
    }

    # La API del admin solo se alcanza desde la VPN interna, igual que /admin:
    # abrirla al mundo dejaría la cerradura de la clave como única defensa.
    location /api/admin {
        allow 127.0.0.1;
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        # 16k alcanza de sobra para la fila de estadísticas, que es lo único
        # que manda el navegador por POST. La ingesta tiene su bloque arriba.
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3200/health;
        access_log off;
    }

    # El servidor MCP, para conectar un agente por URL. Es un POST JSON y, si
    # el cliente pide stream, un SSE: de ahí el buffering off y el timeout
    # largo. Escucha en su propio puerto (3300), no en el de la API.
    location = /mcp {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Las direcciones con contenido indexable las sirve la API (api/src/site.ts).
    # Van antes del catch-all de abajo, que si no devolvería la app y la URL
    # quedaría mostrando el buscador sin el contenido que se quiere indexar.
    location ^~ /empleo/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /mercado {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /rubro/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /departamento/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /puesto/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # La ficha de un servicio, con su `Service` y su `ProfilePage` en JSON-LD.
    # Sin esto el catch-all devuelve la app y la URL queda mostrando el buscador.
    location ^~ /servicios/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # El sitemap ya no es un archivo del build: lo arma la API con las fichas
    # publicadas, así que se pide con la lista al día.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # La guía de entrevista de un rubro, con su FAQPage. Va antes del catch-all,
    # que si no devolvería la app y la URL quedaría mostrando el buscador.
    location ^~ /entrevista/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # curl de la misma URL que el navegador: el tablero en texto, con los
    # filtros que ya viajan en la query. El HTML sigue yendo a quien pide
    # una página. La negociación se duplica en web/vite.config.ts para el
    # dev server. `map` iría en el bloque http, y este archivo es solo el
    # server, así que la detección vive acá adentro.
    location = / {
        error_page 418 = @cli;
        set $jobit_cli "";
        if ($http_user_agent ~* "(curl|Wget|HTTPie|aria2|Go-http-client|python-requests|Python-urllib|libwww-perl|axios/|Lynx|w3m)") {
            set $jobit_cli "1";
        }
        if ($http_accept ~* "text/plain") {
            set $jobit_cli "1";
        }
        if ($jobit_cli) {
            return 418;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location @cli {
        proxy_pass http://127.0.0.1:3200/api/cli$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # La app vive en una sola url y usa query params, así que esto es sobre
    # todo para que un enlace viejo no termine en un 404 del server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
